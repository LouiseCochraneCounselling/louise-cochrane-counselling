<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield/Protective Symbol -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield Icon -->
  <path d="M 10 15 L 10 25 Q 10 35 20 38 Q 30 35 30 25 L 30 15 Q 30 5 20 5 Q 10 5 10 15 Z" 
        fill="url(#shieldGradient)" 
        stroke="#2d5a87" 
        stroke-width="1.5"/>
  
  <!-- Heart/Safety Symbol inside shield -->
  <path d="M 20 12 Q 18 10 16 12 Q 14 14 16 16 L 20 20 L 24 16 Q 26 14 24 12 Q 22 10 20 12 Z" 
        fill="#ffffff" 
        opacity="0.9"/>
  
  <!-- Text: The Holding Space -->
  <text x="45" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d5a87">
    The Holding Space
  </text>
  
  <!-- Subtitle/Decorative line -->
  <line x1="45" y1="32" x2="195" y2="32" stroke="#4a90e2" stroke-width="2" opacity="0.6"/>
</svg>

