<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="supportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Two overlapping circles representing connection and support -->
  <circle cx="12" cy="20" r="8" fill="url(#supportGradient)" opacity="0.9"/>
  <circle cx="20" cy="20" r="8" fill="url(#supportGradient)" opacity="0.7"/>
  
  <!-- Connecting line between circles -->
  <path d="M 12 20 L 20 20" stroke="#4a90e2" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Text: The Holding Space -->
  <text x="32" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2d5a87">
    The Holding Space
  </text>
</svg>
